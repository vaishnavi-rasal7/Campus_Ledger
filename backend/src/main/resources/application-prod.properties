# ==============================================================
# Production Configuration (Active with --spring.profiles.active=prod)
# ==============================================================

server.port=${PORT:8080}

# Managed Cloud MySQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In production, schema changes should be managed, not auto-mutated
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Production CORS domain
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# HikariCP production tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
