# ==============================================================
# Campus Ledger - Backend Configuration (Deployment Ready)
# ==============================================================

spring.application.name=studentmanagement
server.port=${PORT:8080}

# Smart Database Configuration:
# - Connects to Cloud / Local MySQL if DB_URL is provided (e.g. jdbc:mysql://...)
# - Falls back to persistent embedded file DB if DB_URL is omitted (zero-configuration deployment)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/studentdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Centralized CORS: allows local dev, wildcard Vercel previews, or custom production domains
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

logging.level.com.example.studentmanagement=INFO
