# ==============================================================
# Development / Standalone Demo Profile (active via --spring.profiles.active=dev)
# Embedded persistent MySQL-mode database when local MySQL service is offline
# ==============================================================

server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/studentdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

logging.level.com.example.studentmanagement=INFO
