services:
  - type: web
    name: campus-ledger-backend
    env: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/studentmanagement-0.0.1-SNAPSHOT.jar --server.port=$PORT
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: PORT
        value: 8080
